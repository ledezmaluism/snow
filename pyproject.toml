[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "snow"
version = "0.1.0"
description = "Simulator for Nonlinear Optical Waveguides"
authors = [
    {name = "Luis Ledezma, Ph.D.", email = "ledezmaluism@gmail.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">= 3.10"
dependencies = [
    "numpy >= 2.2",
    "matplotlib >= 3.10",
    "scipy >= 1.15",
]

[project.optional-dependencies]
# colorcet is imported by snow.opos and used by the tutorials
opo = ["colorcet"]
tutorials = ["colorcet", "jupyter"]
test = ["pytest", "colorcet"]
dev = ["pytest", "colorcet", "ruff"]

[project.urls]
Repository = "https://github.com/ledezmaluism/snow"
Issues = "https://github.com/ledezmaluism/snow/issues"

[tool.setuptools.packages.find]
include = ["snow*"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]
extend-exclude = ["tutorials"]

[tool.ruff.lint]
# pyflakes (unused/undefined names) and syntax errors; style rules come later
select = ["F", "E9"]
